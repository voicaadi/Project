
name: DevOps AI Assistant CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
concurrency:
  group: adri-ai-production
  cancel-in-progress: false

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: devops_ai_test
          POSTGRES_USER: devops_user
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devops_user -d devops_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: devops_ai_test
      POSTGRES_USER: devops_user
      POSTGRES_PASSWORD: ci-test-password
      JWT_SECRET_KEY: ci-test-secret-not-for-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Initialize test database
        working-directory: backend
        run: PYTHONPATH=. python -m app.database.init_db

      - name: Run backend tests
        working-directory: backend
        run: PYTHONPATH=. python -m pytest -q

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  publish-images:
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/devops-ai-backend:latest
            ghcr.io/${{ github.repository_owner }}/devops-ai-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/devops-ai-frontend:latest
            ghcr.io/${{ github.repository_owner }}/devops-ai-frontend:${{ github.sha }}

  deploy:
    name: Deploy to Local Kubernetes
    runs-on: [self-hosted, Linux, X64, adri-wsl]
    needs: [publish-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Verify Kubernetes connection
        run: kubectl cluster-info

      - name: Deploy backend
        run: |
          kubectl set image deployment/devops-ai-backend \
            backend=ghcr.io/${{ github.repository_owner }}/devops-ai-backend:${{ github.sha }} \
            -n devops-ai

      - name: Deploy frontend
        run: |
          kubectl set image deployment/devops-ai-frontend \
            frontend=ghcr.io/${{ github.repository_owner }}/devops-ai-frontend:${{ github.sha }} \
            -n devops-ai

      - name: Wait for backend rollout
        run: |
          kubectl rollout status deployment/devops-ai-backend \
            -n devops-ai --timeout=180s

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/devops-ai-frontend \
            -n devops-ai --timeout=180s
      - name: Verify public application
        run: |
          curl --fail --retry 5 --retry-delay 5 https://devopsadi.com/health
