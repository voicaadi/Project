apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-ai-backend
  namespace: devops-ai-staging
  labels:
    app: devops-ai-backend
    environment: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-ai-backend
  template:
    metadata:
      labels:
        app: devops-ai-backend
        environment: staging
    spec:
      containers:
        - name: backend
          image: ghcr.io/voicaadi/devops-ai-backend:5b538328b7abd31b485caa4598bea3bb9777236d
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: devops_ai_staging
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: staging-db-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: staging-db-secrets
                  key: POSTGRES_PASSWORD
          envFrom:
            - secretRef:
                name: staging-app-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: devops-ai-staging
  labels:
    environment: staging
spec:
  type: ClusterIP
  selector:
    app: devops-ai-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
